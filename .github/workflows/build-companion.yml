name: Build DeskBuddy Companion
on:
  push:
    paths:
      - 'tools/deskbuddy_companion/**'
      - '.github/workflows/build-companion.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'x86_64-pc-windows-msvc' }
      - run: npm install
        working-directory: tools/deskbuddy_companion
      - run: npx tauri build --bundles nsis
        working-directory: tools/deskbuddy_companion
      - name: Upload to R2
        run: |
          $bundleFile = (Get-Item "src-tauri/target/release/bundle/nsis/*.exe").FullName
          npx wrangler r2 object put deskbuddy-firmware/companion/deskbuddy-companion-windows.exe --file "$bundleFile" --remote
        working-directory: tools/deskbuddy_companion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

