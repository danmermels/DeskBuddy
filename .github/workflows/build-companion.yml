name: Build DeskBuddy Companion
on:
  push:
    paths:
      - 'tools/deskbuddy_companion/**'
      - '.github/workflows/build-companion.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'x86_64-pc-windows-msvc' }
      - run: npm install
        working-directory: tools/deskbuddy_companion
      - run: npx tauri build --bundles nsis
        working-directory: tools/deskbuddy_companion
      - uses: actions/upload-artifact@v4
        with:
          name: deskbuddy-companion-windows
          path: tools/deskbuddy_companion/src-tauri/target/release/bundle/nsis/*.exe

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: rustup target add aarch64-apple-darwin
      - run: npm install
        working-directory: tools/deskbuddy_companion
      - run: npx tauri build --target aarch64-apple-darwin --bundles dmg
        working-directory: tools/deskbuddy_companion
      - uses: actions/upload-artifact@v4
        with:
          name: deskbuddy-companion-mac-arm64
          path: tools/deskbuddy_companion/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  macos-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: rustup target add x86_64-apple-darwin
      - run: npm install
        working-directory: tools/deskbuddy_companion
      - run: npx tauri build --target x86_64-apple-darwin --bundles dmg
        working-directory: tools/deskbuddy_companion
      - uses: actions/upload-artifact@v4
        with:
          name: deskbuddy-companion-mac-x64
          path: tools/deskbuddy_companion/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install
        working-directory: tools/deskbuddy_companion
      - run: npx tauri build --bundles deb
        working-directory: tools/deskbuddy_companion
      - uses: actions/upload-artifact@v4
        with:
          name: deskbuddy-companion-linux
          path: tools/deskbuddy_companion/src-tauri/target/release/bundle/deb/*.deb
