<!DOCTYPE html>
<html>
<head>
    <title>HiTech Face Plate Layout Analysis</title>
    <style>
        body {
            background-color: #0b0f12;
            color: #ecf0f1;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #57afae;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .card {
            background-color: #172224;
            border: 2px solid #2d4245;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .display-view {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 4px solid #57afae;
            overflow: hidden;
            position: relative;
            background-color: #000000;
        }
        img.faceplate {
            width: 240px;
            height: 240px;
            object-fit: fill;
        }
        svg.vector-overlay {
            width: 240px;
            height: 240px;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <h1>HiTech Face Plate Style & Coordinate Reference</h1>
    <p>Visualizing the layout on a 240x240 screen boundary centered at (120, 120)</p>
    
    <div class="container">
        <!-- Original image -->
        <div class="card">
            <h3>Original Reference (HiTechFacePlateClean.png)</h3>
            <div class="display-view">
                <img class="faceplate" src="HiTechFacePlateClean.png" alt="Original Template">
            </div>
        </div>

        <!-- Detected Vectors Overlay -->
        <div class="card">
            <h3>Layout Construction (Vectors)</h3>
            <div class="display-view">
                <svg class="vector-overlay">
                    <!-- Background -->
                    <rect width="240" height="240" fill="#000000" />
                    
                    <!-- Outer Bezel Ring (R=105) -->
                    <circle cx="120" cy="120" r="105" stroke="#57afae" stroke-width="2" fill="none" />
                    <!-- Inner Bezel Ring (R=101) -->
                    <circle cx="120" cy="120" r="101" stroke="#2b5f61" stroke-width="1.5" fill="none" />
                    
                    <!-- Time Digits placeholder -->
                    <text x="120" y="90" fill="#ffffff" font-size="28" font-weight="bold" text-anchor="middle" font-family="monospace">14:30</text>
                    
                    <!-- Date placeholder -->
                    <text x="120" y="115" fill="#a4c6c5" font-size="11" text-anchor="middle" font-family="monospace">THU 25 OCT</text>
                    
                    <!-- Middle Horizontal Dividers Y=133 -->
                    <line x1="15" y1="133" x2="109" y2="133" stroke="#57afae" stroke-width="1.5" />
                    <line x1="131" y1="133" x2="225" y2="133" stroke="#57afae" stroke-width="1.5" />
                    
                    <!-- Bottom Horizontal Dividers Y=162 -->
                    <line x1="19" y1="162" x2="109" y2="162" stroke="#57afae" stroke-width="1.5" />
                    <line x1="131" y1="162" x2="221" y2="162" stroke="#57afae" stroke-width="1.5" />
                    
                    <!-- Central Vertical Channels X=116, X=123 -->
                    <line x1="116" y1="133" x2="116" y2="162" stroke="#57afae" stroke-width="1.5" />
                    <line x1="124" y1="133" x2="124" y2="162" stroke="#57afae" stroke-width="1.5" />
                    
                    <!-- Grid indicators/ticks on left/right boxes -->
                    <!-- Left box: X=[15, 109], Y=[133, 162] -->
                    <!-- Right box: X=[131, 225], Y=[133, 162] -->
                    <text x="62" y="152" fill="#57afae" font-size="9" text-anchor="middle">METRIC 1</text>
                    <text x="178" y="152" fill="#57afae" font-size="9" text-anchor="middle">METRIC 2</text>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
