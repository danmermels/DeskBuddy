<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin — DeskBuddy</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0e17;color:#e2e8f0}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#111827;border-bottom:1px solid #1e293b}
.nav h2{font-size:1rem;color:#38bdf8}
.nav a{color:#94a3b8;text-decoration:none;font-size:0.82rem}
.nav a:hover{color:#e2e8f0}
.tabs{display:flex;gap:2px;padding:12px 24px;background:#0d1117;border-bottom:1px solid #1e293b}
.tab{padding:8px 16px;border-radius:6px;cursor:pointer;font-size:0.82rem;font-weight:600;color:#64748b;background:none;border:none}
.tab.active{background:#38bdf8;color:#0a0e17}
.container{max-width:1100px;margin:0 auto;padding:24px}
table{width:100%;border-collapse:collapse;font-size:0.84rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #1e293b}
th{color:#64748b;font-weight:600;text-transform:uppercase;font-size:0.72rem;letter-spacing:0.04em}
input,textarea{width:100%;padding:10px 12px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#f8fafc;font-size:0.88rem;outline:none;margin-bottom:8px;font-family:inherit}
input:focus,textarea:focus{border-color:#38bdf8}
textarea{min-height:60px;resize:vertical}
.btn{background:#38bdf8;color:#0a0e17;padding:8px 16px;border-radius:6px;border:none;font-weight:700;cursor:pointer;font-size:0.82rem}
.btn:hover{background:#7dd3fc}
.btn-sm{padding:4px 10px;font-size:0.75rem;border-radius:4px}
.btn-edit{background:#38bdf820;color:#38bdf8;border:1px solid #38bdf840;margin-right:4px}
.btn-del{background:#ef444420;color:#ef4444;border:1px solid #ef444440}
.btn-cancel{background:#1e293b;color:#e2e8f0}
.btn-cancel:hover{background:#334155}
.modal{display:none;position:fixed;inset:0;background:#00000080;z-index:100;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-box{background:#111827;border:1px solid #1e293b;border-radius:12px;padding:32px;max-width:420px;width:100%;margin:20px}
.form-group{margin-bottom:12px}
.form-group label{display:block;color:#94a3b8;font-size:0.75rem;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.04em}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.section{margin-bottom:32px;display:none}
.section.active{display:block}
.section h3{font-size:1.1rem;margin-bottom:12px;color:#e2e8f0}
.msg{color:#38bdf8;font-size:0.82rem;margin-top:8px;min-height:20px}
.login-box{max-width:400px;margin:80px auto;background:#111827;border:1px solid #1e293b;border-radius:16px;padding:40px}
.login-box h1{font-size:1.4rem;color:#38bdf8;margin-bottom:16px;text-align:center}
.login-box input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#f8fafc;font-size:0.9rem;outline:none;margin-bottom:12px}
.login-box input:focus{border-color:#38bdf8}
.login-box button{width:100%;padding:12px}
#loginErr{color:#ef4444;font-size:0.82rem;margin-top:8px;text-align:center;min-height:20px}
.badge{display:inline-block;padding:1px 8px;border-radius:8px;font-size:0.7rem;font-weight:700}
.badge-active{background:#38bdf830;color:#38bdf8}
.badge-hidden{background:#ef444430;color:#ef4444}
</style>
</head>
<body>
<div id="loginScreen" class="login-box">
  <h1>DeskBuddy Admin</h1>
  <input type="password" id="pw" placeholder="Admin password" autofocus />
  <button class="btn" onclick="login()" style="width:100%">Login</button>
  <div id="loginErr"></div>
</div>

<div id="appScreen" style="display:none">
<nav class="nav"><h2>DeskBuddy Admin</h2><div><a href="/">Site</a> &middot; <a href="/store">Store</a> &middot; <a href="#" onclick="logout()">Logout</a></div></nav>
<div class="tabs"><button class="tab active" onclick="showTab('products',this)">Products</button><button class="tab" onclick="showTab('orders',this)">Orders</button><button class="tab" onclick="showTab('tickets',this)">Tickets</button></div>
<div class="container">

<div id="tab-products" class="section active">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3>Products</h3><button class="btn" onclick="editProduct()">+ Add Product</button></div>
  <table><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Status</th><th>Order</th><th></th></tr></thead><tbody id="productRows"></tbody></table>
</div>

<div id="tab-orders" class="section">
  <h3>Recent Orders</h3>
  <table><thead><tr><th>Session</th><th>Email</th><th>Total</th><th>Status</th><th>Date</th></tr></thead><tbody id="orderRows"></tbody></table>
</div>

<div id="tab-tickets" class="section">
  <h3>Support Tickets</h3>
  <table><thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Date</th></tr></thead><tbody id="ticketRows"></tbody></table>
</div>

</div></div>

<div class="modal" id="productModal"><div class="modal-box">
  <h3 style="margin-bottom:16px;color:#38bdf8" id="modalTitle">Add Product</h3>
  <input type="hidden" id="prodId" />
  <div class="form-group"><label>Name</label><input type="text" id="prodName" placeholder="Product name" /></div>
  <div class="form-group"><label>Description</label><textarea id="prodDesc" placeholder="Short description"></textarea></div>
  <div class="form-group"><label>Price (cents — 9900 = $99.00)</label><input type="number" id="prodPrice" placeholder="9900" /></div>
  <div class="form-group"><label>Sort Order</label><input type="number" id="prodSort" value="0" /></div>
  <div class="form-group"><label style="display:inline-block;margin-right:8px">Active</label><input type="checkbox" id="prodActive" checked style="width:auto;margin:0" /></div>
  <div class="form-actions"><button class="btn btn-cancel" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveProduct()">Save</button></div>
  <div class="msg" id="productMsg"></div>
</div></div>

<script>
var token = localStorage.getItem("db_admin")||"";

function authFetch(url, opts){
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers.Authorization = "Bearer " + token;
  return fetch(url, opts);
}

// Login
async function login(){
  var pw = document.getElementById("pw").value;
  try {
    var r = await fetch("/admin/auth", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})});
    var d = await r.json();
    if(d.ok){token=pw;localStorage.setItem("db_admin",pw);showApp()}
    else{document.getElementById("loginErr").textContent="Wrong password"}
  }catch(e){document.getElementById("loginErr").textContent="Network error"}
}
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")login()});

function logout(){token="";localStorage.removeItem("db_admin");location.reload()}

// Init
if(token){tryAuth()}
async function tryAuth(){
  try{
    var r = await authFetch("/api/admin/products");
    if(r.ok){showApp();return}
  }catch(e){}
  token="";localStorage.removeItem("db_admin");
}

function showApp(){
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("appScreen").style.display="";
  loadProducts();
  loadOrders();
  loadTickets();
}

// Tabs
function showTab(name,btn){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active")});
  btn.classList.add("active");
  document.querySelectorAll(".section").forEach(function(s){s.classList.remove("active")});
  document.getElementById("tab-"+name).classList.add("active");
}

// Products
async function loadProducts(){
  try{
    var r = await authFetch("/api/admin/products");
    var data = await r.json();
    renderProducts(data.products||[]);
  }catch(e){}
}
function renderProducts(products){
  document.getElementById("productRows").innerHTML = products.map(function(p){
    return "<tr><td>"+p.id+"</td><td>"+p.name+"</td><td>$"+(p.price_cents/100).toFixed(2)+"</td>"
      + "<td><span class=\"badge "+(p.active?"badge-active":"badge-hidden")+"\">"+(p.active?"Active":"Hidden")+"</span></td>"
      + "<td>"+p.sort_order+"</td>"
      + "<td><button class=\"btn btn-sm btn-edit\" onclick=\"editProduct("+p.id+",'"+p.slug+"','"+p.name.replace(/'/g,"\\'")+"',"+p.price_cents+","+p.active+","+p.sort_order+")\">Edit</button>"
      + "<button class=\"btn btn-sm btn-del\" onclick=\"deleteProduct("+p.id+")\">Del</button></td></tr>";
  }).join("") || "<tr><td colspan=\"6\" style=\"color:#64748b\">No products yet</td></tr>";
}
function editProduct(id,slug,name,price,active,sort){
  document.getElementById("prodId").value = id||"";
  document.getElementById("prodName").value = name||"";
  document.getElementById("prodDesc").value = "";
  document.getElementById("prodPrice").value = price||"";
  document.getElementById("prodSort").value = sort||0;
  document.getElementById("prodActive").checked = active!==0;
  document.getElementById("modalTitle").textContent = id?"Edit Product":"Add Product";
  document.getElementById("productModal").classList.add("open");
}
function closeModal(){document.getElementById("productModal").classList.remove("open")}
async function saveProduct(){
  var id = document.getElementById("prodId").value;
  var name = document.getElementById("prodName").value.trim();
  var desc = document.getElementById("prodDesc").value.trim();
  var price = parseInt(document.getElementById("prodPrice").value)||0;
  var sort = parseInt(document.getElementById("prodSort").value)||0;
  var active = document.getElementById("prodActive").checked;
  if(!name||!price){document.getElementById("productMsg").textContent="Name and price required";return}
  try{
    var body = {name:name,description:desc,price_cents:price,sort_order:sort,active:active};
    if(id) body.id = parseInt(id);
    var r = await authFetch("/api/admin/products" + (id?"?id="+id:""), {method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    var d = await r.json();
    if(d.ok){closeModal();loadProducts()}else{document.getElementById("productMsg").textContent=d.error||"Save failed"}
  }catch(e){document.getElementById("productMsg").textContent="Network error"}
}
async function deleteProduct(id){
  if(!confirm("Delete product "+id+"?"))return;
  await authFetch("/api/admin/products?id="+id,{method:"DELETE"});
  loadProducts();
}

// Orders
async function loadOrders(){
  try{
    var r = await authFetch("/api/admin/orders");
    var data = await r.json();
    document.getElementById("orderRows").innerHTML = (data.orders||[]).map(function(o){
      return "<tr><td style=\"font-size:0.72rem\">"+o.stripe_session_id.substring(0,16)+"</td><td>"+o.customer_email+"</td><td>$"+(o.total_cents/100).toFixed(2)+"</td><td>"+o.status+"</td><td>"+o.created_at+"</td></tr>";
    }).join("") || "<tr><td colspan=\"5\" style=\"color:#64748b\">No orders yet</td></tr>";
  }catch(e){}
}

// Tickets
async function loadTickets(){
  try{
    var r = await authFetch("/api/admin/tickets");
    var data = await r.json();
    document.getElementById("ticketRows").innerHTML = (data.tickets||[]).map(function(t){
      return "<tr><td>"+t.name+"</td><td>"+t.email+"</td><td>"+t.subject+"</td><td style=\"font-size:0.78rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">"+t.message+"</td><td>"+t.created_at+"</td></tr>";
    }).join("") || "<tr><td colspan=\"5\" style=\"color:#64748b\">No tickets</td></tr>";
  }catch(e){}
}
</script>
</body>
</html>
