[package]
name = "deskbuddy-companion"
version = "1.0.0"
description = "DeskBuddy system tray companion app"
authors = ["DeskBuddy"]
edition = "2021"

[lib]
name = "deskbuddy_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.20"
open = "5"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
