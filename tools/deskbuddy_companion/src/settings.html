<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeskBuddy IP Address</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#1e293b;
    color:#f8fafc;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
    height:100vh;
  }
  .header { display:flex; justify-content:space-between; align-items:center; }
  h3 { font-size:0.95rem; font-weight:700; color:#f8fafc; }
  .close-icon {
    cursor:pointer;
    background:rgba(51,65,85,0.6);
    border:1px solid rgba(71,85,105,0.8);
    border-radius:4px;
    color:#94a3b8;
    padding:2px 6px;
    font-size:0.75rem;
    font-weight:700;
  }
  .close-icon:hover { color:#f87171; background:rgba(239,68,68,0.2); }
  p { color:#94a3b8; font-size:0.78rem; line-height:1.3; }
  .row { display:flex; gap:8px; align-items:center; }
  input {
    flex:1;
    padding:8px 10px;
    border-radius:6px;
    border:1px solid #334155;
    background:#0f172a;
    color:#f8fafc;
    font-size:0.88rem;
    outline:none;
  }
  input:focus { border-color:#38bdf8; box-shadow:0 0 6px rgba(56,189,248,0.3); }
  button {
    background:#38bdf8;
    color:#0f172a;
    padding:8px 16px;
    border:none;
    border-radius:6px;
    font-weight:700;
    cursor:pointer;
    font-size:0.85rem;
    white-space:nowrap;
    transition:all 0.15s;
  }
  button:hover { background:#7dd3fc; }
  .btn-cancel {
    background:rgba(51,65,85,0.7);
    color:#cbd5e1;
    font-weight:500;
  }
  .btn-cancel:hover { background:rgba(71,85,105,0.9); color:#fff; }
  .hint { color:#64748b; font-size:0.7rem; margin-top:auto; }
  #status { color:#38bdf8; font-size:0.75rem; min-height:16px; font-weight:600; }
</style>
</head>
<body>
<div class="header">
  <h3>Enter DeskBuddy IP Address</h3>
  <button class="close-icon" id="closeXBtn">✕</button>
</div>
<p>If mDNS discovery is blocked on your network, enter the static/local IP of your DeskBuddy.</p>
<div class="row">
  <input type="text" id="ip" placeholder="e.g. 192.168.15.160" autofocus />
  <button id="saveBtn">Save</button>
  <button class="btn-cancel" id="cancelBtn">Close</button>
</div>
<div id="status"></div>
<p class="hint">Log: <code>%LOCALAPPDATA%\DeskBuddy Companion\companion.log</code></p>

<script>
function getInvoke() {
  if (window.__TAURI_INTERNALS__ && typeof window.__TAURI_INTERNALS__.invoke === 'function') {
    return window.__TAURI_INTERNALS__.invoke;
  }
  if (window.__TAURI__ && window.__TAURI__.core && typeof window.__TAURI__.core.invoke === 'function') {
    return window.__TAURI__.core.invoke;
  }
  return null;
}

const statusEl = document.getElementById('status');
const ipInput = document.getElementById('ip');

async function closeWindow() {
  const invoke = getInvoke();
  if (invoke) {
    try {
      await invoke('close_settings_window');
    } catch(e) {
      window.close();
    }
  } else {
    window.close();
  }
}

async function init() {
  const invoke = getInvoke();
  if (!invoke) {
    statusEl.textContent = 'Ready (Tauri IPC active)';
    return;
  }
  try {
    const saved = await invoke('get_saved_ip_cmd');
    if (saved) {
      ipInput.value = saved;
      statusEl.textContent = 'Configured: ' + saved;
    }
  } catch (e) {
    statusEl.textContent = 'Ready to set IP';
  }
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const ip = ipInput.value.trim();
  if (!ip) { statusEl.textContent = 'Please enter an IP address'; return; }
  const invoke = getInvoke();
  if (!invoke) { statusEl.textContent = 'IPC not ready'; return; }
  try {
    statusEl.textContent = 'Saving...';
    await invoke('save_ip_cmd', { ip });
    statusEl.textContent = 'Saved! Connecting to ' + ip + '...';
    setTimeout(closeWindow, 500);
  } catch (e) {
    statusEl.textContent = 'Save failed: ' + e;
  }
});

document.getElementById('cancelBtn').addEventListener('click', closeWindow);
document.getElementById('closeXBtn').addEventListener('click', closeWindow);

ipInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('saveBtn').click();
  if (e.key === 'Escape') closeWindow();
});

init();
</script>
</body>
</html>
